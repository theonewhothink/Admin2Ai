[project]
name = "backoffice"
version = "0.1.0"
description = "AI Back-Office Operator: evidence-first administrative closure engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
workflows = ["temporalio>=1.8"]
dev = ["pytest>=8", "httpx>=0.27", "temporalio>=1.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
