[project]
name = "backoffice"
version = "0.1.0"
description = "AI Back-Office Operator: evidence-first administrative closure engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "cryptography>=42",
    # The API imports the connectors package at start-up (api/app.py), and the
    # Gmail, Microsoft and open banking clients use httpx.
    "httpx>=0.27",
]

[project.optional-dependencies]
workflows = ["temporalio>=1.8"]
# Reading uploaded PDFs and photos (backoffice.reading), every import lazy:
#   documents  the PDF text layer, metadata and embedded e-invoices (Stage 0)
#   qr         fiscal QR codes decoded from photos and scanned pages
#   vision     page rendering and masking before the Claude vision fallback (§53);
#              the Anthropic call itself uses httpx, a core dependency
#   ocr-local  PP-OCRv6 on this server's own CPU (RapidOCR + onnxruntime; the wheel ships the
#              PP-OCRv6 small ONNX models): photos and scanned PDFs are read with no sidecar, no
#              account and no network. Pillow and numpy also measure a photo's sharpness;
#              pypdfium2 renders a scanned PDF's pages. Never in the browser bundle.
documents = ["pypdf>=3.17"]
qr = ["zxing-cpp>=2.2", "Pillow>=10", "pypdfium2>=4"]
vision = ["Pillow>=10", "pypdfium2>=4"]
ocr-local = ["rapidocr>=3.9,<4", "onnxruntime>=1.20", "Pillow>=10", "numpy>=1.26", "pypdfium2>=4"]
# Invoice pages that only show the document with JavaScript, opened in Chromium (one fresh browser per
# link, in its own worker process); then run `python -m playwright install --with-deps chromium`.
browser = ["playwright>=1.48"]
# The production API (BACKOFFICE_MODE=production): PostgreSQL, S3 evidence and KMS
# (boto3), the server-side chat (anthropic). All imported lazily.
server = ["psycopg[binary]>=3.1", "boto3>=1.34", "anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "temporalio>=1.8", "pypdf>=3.17", "Pillow>=10", "psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
