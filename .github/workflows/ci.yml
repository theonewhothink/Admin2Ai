name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e "./backend[dev]"

      # The runner image ships PostgreSQL server binaries: the database tests
      # start a throwaway cluster (pgvector-only tests skip; the sql job runs them).
      - name: Test
        working-directory: backend
        run: python -m pytest -q

  web:
    name: Web (Next.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  mobile:
    name: Mobile (Expo, TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

  sql:
    name: SQL migrations (PostgreSQL 16 + pgvector)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backoffice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backoffice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: backoffice
    steps:
      - uses: actions/checkout@v4

      # Plain psql, file by file in order, each in one transaction: the
      # migrations must stand on their own, without the Python runner.
      - name: Apply db/migrations/*.sql in order
        run: |
          set -euo pipefail
          for file in db/migrations/*.sql; do
            echo "::group::${file}"
            psql -X -q -v ON_ERROR_STOP=1 --single-transaction -f "${file}"
            echo "::endgroup::"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e "./backend[dev]"

      - name: Schema invariants (RLS, no floats, append-only history, roles)
        env:
          PYTHONPATH: db
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/backoffice
        run: python -m backoffice_db check

      - name: Migration runner on a fresh database (bookkeeping, idempotence)
        env:
          PYTHONPATH: db
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runner_check
        run: |
          set -euo pipefail
          createdb runner_check
          python -m backoffice_db migrate
          python -m backoffice_db migrate | grep -q "nothing to apply"
          python -m backoffice_db status
          python -m backoffice_db check

      - name: Database behaviour tests (isolation, immutability, golden rule, pgvector)
        working-directory: backend
        env:
          BACKOFFICE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -q tests/test_infra_postgres.py

  infra:
    name: Infrastructure (Terraform, Compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4" # the version the configuration was validated with
          terraform_wrapper: false

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      # Mocked providers: no AWS credentials needed.
      - run: terraform test

      - name: docker compose config
        working-directory: .
        run: docker compose --env-file .env.example config --quiet
