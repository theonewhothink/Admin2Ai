name: Pages

# Builds the static site (the real Python engine running in the browser) and
# publishes it to the gh-pages branch, which GitHub Pages serves at
# https://theonewhothink.github.io/Admin2Ai/.
#
# Runs on every push to the repository's default branch, or by hand.
# gh-pages keeps a single commit (the current site), as before.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # The snapshot step runs the demo engine natively.
      - name: Install engine
        run: pip install -e ./backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache Pyodide runtime
        uses: actions/cache@v4
        with:
          path: web/public/pyodide
          key: pyodide-${{ hashFiles('backend/scripts/fetch_pyodide.sh') }}

      - name: Build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build:pages
          test -s out/index.html
          test -s out/engine/backoffice.zip
          test -s out/engine/snapshot.json
          test -s out/pyodide/pyodide.asm.wasm

      - name: Publish to gh-pages
        working-directory: web/out
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${SOURCE_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
